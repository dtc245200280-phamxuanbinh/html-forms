<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ví dụ 2 - Các cột có kích thước khác nhau</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 100px 200px 1fr;
            gap: 10px;
        }

        .grid-container div {
            background-color: lightgreen;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
    </div>
</body>
</html>
