<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký học viên</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px 15px;
        }
        .form-box {
            max-width: 560px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        h2 {
            text-align: center;
            color: #1a5fb4;
            margin-top: 0;
        }
        .row {
            margin-bottom: 16px;
        }
        .title {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333333;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #bbbbbb;
            border-radius: 4px;
            font-size: 15px;
            font-family: inherit;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #1a5fb4;
            outline: none;
        }
        textarea {
            resize: vertical;
        }
        .options label {
            margin-right: 18px;
            cursor: pointer;
        }
        .buttons {
            text-align: center;
            margin-top: 22px;
        }
        .buttons input {
            padding: 9px 24px;
            font-size: 15px;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            margin: 0 6px;
        }
        .btn-submit { background-color: #1a5fb4; }
        .btn-reset  { background-color: #888888; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Đăng ký học viên</h2>
        <form action="#" method="GET">
            <div class="row">
                <label class="title" for="fullname">Họ và tên</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên">
            </div>

            <div class="row">
                <label class="title" for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com">
            </div>

            <div class="row">
                <label class="title" for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại">
            </div>

            <div class="row">
                <label class="title" for="birthday">Ngày sinh</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="row options">
                <span class="title">Giới tính</span>
                <label><input type="radio" name="gender" value="Nam"> Nam</label>
                <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
                <label><input type="radio" name="gender" value="Khác"> Khác</label>
            </div>

            <div class="row">
                <label class="title" for="address">Địa chỉ</label>
                <textarea id="address" name="address" rows="2" placeholder="Nhập địa chỉ"></textarea>
            </div>

            <div class="row">
                <label class="title" for="course">Khóa học</label>
                <select id="course" name="course">
                    <option value="HTML & CSS">HTML &amp; CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                </select>
            </div>

            <div class="row options">
                <span class="title">Hình thức học</span>
                <label><input type="radio" name="study_type" value="Online"> Online</label>
                <label><input type="radio" name="study_type" value="Offline"> Offline</label>
            </div>

            <div class="row options">
                <span class="title">Sở thích</span>
                <label><input type="checkbox" name="hobby" value="Đọc sách"> Đọc sách</label>
                <label><input type="checkbox" name="hobby" value="Nghe nhạc"> Nghe nhạc</label>
                <label><input type="checkbox" name="hobby" value="Thể thao"> Thể thao</label>
                <label><input type="checkbox" name="hobby" value="Du lịch"> Du lịch</label>
            </div>

            <div class="row">
                <label class="title" for="note">Ghi chú</label>
                <textarea id="note" name="note" rows="4" placeholder="Nhập ghi chú"></textarea>
            </div>

            <div class="buttons">
                <input type="submit" class="btn-submit" value="Đăng ký">
                <input type="reset" class="btn-reset" value="Nhập lại">
            </div>
        </form>
    </div>
</body>
</html>
