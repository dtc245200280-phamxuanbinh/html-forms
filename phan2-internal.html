<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 2 - Internal style</title>
    <!-- Internal style: viết trong thẻ <style> ở phần <head> -->
    <style>
        h1 {
            color: green;
        }
        p {
            color: orange;
        }
    </style>
</head>
<body>
    <h1>Phần 2: Internal style</h1>
    <p>Màu chữ của đoạn văn này được đặt bằng thẻ style trong phần head.</p>
</body>
</html>
